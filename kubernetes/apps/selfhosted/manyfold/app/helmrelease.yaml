---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app manyfold
  namespace: selfhosted
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  interval: 1h

  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      manyfold:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 17.6.0@sha256:86a1992d46273c58fd4ad95b626081dfaabfe16bd56944675169e406d1a660dd
            envFrom: &envFrom
              - secretRef:
                  name: manyfold-secret
          chown-tmpdirs:
            image:
              repository: docker.io/library/alpine
              tag: 3.24
            command:
              - /bin/sh
              - -c
            args:
              - |
                chmod o-rwx /app/tmp /tmp
            securityContext:
              runAsUser: 0
        containers:
          app:
            image:
              repository: ghcr.io/bjw-s-labs/manyfold
              tag: 0.149.0@sha256:8f80633eff8e2668e70194938723d07f536e04765f7ab5742ccd26f1a886885f
            env:
              DATABASE_ADAPTER: postgresql
              PORTS: &port 3214
              MULTIUSER: enabled
              PUBLIC_HOSTNAME: 3d.${SECRET_DOMAIN}
              PUBLIC_PORT: "443"
              HTTPS_ONLY: enabled
              OIDC_ISSUER: https://id.${SECRET_DOMAIN}
              OIDC_NAME: Pocket-ID
              TZ: ${TIMEZONE}
              REDIS_URL: redis://manyfold-dragonfly-db.selfhosted.svc.cluster.local:6379
              PLUGINS_PATH: /mnt/nas/3dprinting/manyfold-plugins
            envFrom: *envFrom
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 24
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 2Gi
              limits:
                memory: 3Gi
    service:
      app:
        controller: manyfold
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "3d.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: manyfold
          gethomepage.dev/name: manyfold
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/description: STL Library
    persistence:
      tmpfs:
        enabled: true
        type: emptyDir
        advancedMounts:
          manyfold:
            app: &tmpdirs
              - path: /tmp
                subPath: host-tmp
                readOnly: false
              - path: /app/tmp
                subPath: app-tmp
                readOnly: false
            chown-tmpdirs: *tmpdirs
      media:
        type: nfs
        server: nas.${PUBLIC_DOMAIN}
        path: /mnt/tank/maker/3dprinting
        globalMounts:
          - path: /mnt/nas/3dprinting
