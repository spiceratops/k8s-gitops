---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: manyfold
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: manyfold-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Manyfold
        DATABASE_NAME: &dbName manyfold
        DATABASE_HOST: &dbHost postgres-rw.databases.svc.cluster.local
        DATABASE_USER: &dbUser "{{ .POSTGRES_USER }}"
        DATABASE_PASSWORD: &dbPass "{{ .POSTGRES_PASS }}"
        # Postgres Init
        INIT_POSTGRES_DBNAME: *dbName
        INIT_POSTGRES_HOST: *dbHost
        INIT_POSTGRES_USER: *dbUser
        INIT_POSTGRES_PASS: *dbPass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # OIDC
        OIDC_CLIENT_ID: "{{ .MANYFOLD_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .MANYFOLD_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: manyfold
    - extract:
        key: cloudnative-pg
    - extract:
        key: pocket-id
