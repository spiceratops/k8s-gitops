---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: printstash
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: printstash-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Printstash
        VAULT_JWT_SECRET: "{{ .VAULT_JWT_SECRET }}"
        # OIDC
        VAULT_OIDC_CLIENT_ID: "{{ .PRINTSTASH_CLIENT_ID }}"
        VAULT_OIDC_CLIENT_SECRET: "{{ .PRINTSTASH_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: printstash
    - extract:
        key: pocket-id
