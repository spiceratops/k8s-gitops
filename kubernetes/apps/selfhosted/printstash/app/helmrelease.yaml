---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app printstash
  namespace: selfhosted
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  interval: 1h

  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      printstash:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/xiao-villamor/printstash
              tag: "v0.15.1"
            env:
              TZ: ${TIMEZONE}
              PUID: 1000
              PGID: 1000
              UV_CACHE_DIR: /uv-cache
              VAULT_SETUP_MODE: trusted_network
              VAULT_RESTART_ENABLED: "true"
              VAULT_STORAGE_BACKEND: local
              VAULT_MAX_UPLOAD_MB: "512"
              VAULT_OIDC_ENABLED: "true"
              VAULT_OIDC_DISPLAY_NAME: Pocket-ID
              VAULT_OIDC_ISSUER_URL: https://id.${SECRET_DOMAIN}
              VAULT_OIDC_SCOPES: openid profile email printstash
              VAULT_OIDC_ADMIN_GROUPS: family
              VAULT_OIDC_REDIRECT_URI: https://printstash.${SECRET_DOMAIN}/api/v1/auth/oidc/callback
            envFrom:
              - secretRef:
                  name: printstash-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3000
                  periodSeconds: 30
                  failureThreshold: 5
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: printstash
        ports:
          http:
            port: &port 3000
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: printstash
          gethomepage.dev/name: printstash
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/description: STL Library
    persistence:
      uv-cache:
        type: emptyDir
        advancedMounts:
          printstash:
            api:
              - path: /uv-cache
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
