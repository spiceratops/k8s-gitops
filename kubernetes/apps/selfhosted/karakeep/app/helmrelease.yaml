---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app karakeep
  namespace: selfhosted
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  interval: 1h

  values:
    controllers:
      karakeep:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
            env:
              DATA_DIR: /data
              MEILI_ADDR: http://karakeep-meilisearch:7700
              BROWSER_WEB_URL: http://karakeep-browserless:3000
              NEXTAUTH_URL: https://keep.${SECRET_DOMAIN}
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              OPENAI_BASE_URL: http://litellm.ai.svc.cluster.local
              # OAuth setup
              OAUTH_PROVIDER_NAME: Pocket-ID
              OAUTH_WELLKNOWN_URL: https://id.${SECRET_DOMAIN}/.well-known/openid-configuration
              DISABLE_PASSWORD_AUTH: "true"
              OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
              PORT: &port 3001
            envFrom: &envFrom
              - secretRef:
                  name: karakeep-secret
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 750Mi
          meilisearch:
            image:
              repository: getmeili/meilisearch
              tag: v1.56.0@sha256:1f578fa865f8251894b3bf38d6668d6209a3f451f8f65ab953e129d4c1db5ef4
            env:
              MEILI_NO_ANALYTICS: "true"
            envFrom: *envFrom
            args:
              - /bin/meilisearch
              - --experimental-dumpless-upgrade
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
          browserless:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.57.3@sha256:40dff7c23e0e378ba451c23ef66394ffb81bd11e6b9fe8ef3066d59eb402cc5d
            env:
              CONCURRENT: 10
              DATA_DIR: /profile
              DOWNLOAD_DIR: /downloads
              ENABLE_DEBUGGER: false
              EXTERNAL: http://karakeep-browserless.selfhosted.svc.cluster.local
              HEALTH: true
              SCREEN_DEPTH: 16
              SCREEN_HEIGHT: 1024
              SCREEN_WIDTH: 1920
              TIMEOUT: 600000 # 10 minutes
              TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: BROWSERLESS_TOKEN
              TZ: ${TIMEZONE}
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
    service:
      app:
        controller: karakeep
        ports:
          http:
            port: *port
      browserless:
        controller: karakeep
        ports:
          http:
            port: 3000
      meilisearch:
        controller: karakeep
        ports:
          http:
            port: 7700
    route:
      app:
        hostnames:
          - keep.${SECRET_DOMAIN}
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
          - hoarder.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - name: karakeep-app
                port: *port
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: karakeep.png
          gethomepage.dev/name: Karakeep
          gethomepage.dev/url: keep.${SECRET_DOMAIN}
          gethomepage.dev/group: The Internets
          gethomepage.dev/description: Saved Web Content
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          karakeep:
            app:
              - path: /data
                subPath: data
            meilisearch:
              - path: /meili_data
                subPath: meili_data
      browserless:
        type: emptyDir
        sizeLimit: 1Gi
        advancedMounts:
          karakeep:
            browserless:
              - path: /profile
                subPath: profile
              - path: /downloads
                subPath: downloads
      run:
        type: emptyDir
        medium: Memory
        sizeLimit: 100Mi
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
