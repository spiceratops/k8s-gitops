---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: barry-clank
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: barry-clank-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        BRIGHTDATA_API_KEY: "{{ .BRIGHTDATA_API_KEY }}"
        GOOGLE_MAPS_API_KEY: "{{ .GOOGLE_MAPS_API_KEY }}"
  dataFrom:
    - extract:
        key: barry-clank
