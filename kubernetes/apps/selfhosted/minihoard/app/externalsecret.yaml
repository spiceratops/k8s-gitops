---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minihoard
  namespace: selfhosted
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: minihoard-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MMF_API_CLIENT_ID: "{{ .MMF_API_CLIENT_ID }}"
        MMF_API_KEY: "{{ .MMF_API_KEY }}"
        MMF_COOKIE: "{{ .MMF_COOKIE }}"
  dataFrom:
    - extract:
        key: mmf
