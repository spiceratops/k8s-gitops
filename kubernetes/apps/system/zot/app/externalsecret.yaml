---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot
  namespace: system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zot-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        oidc-credentials.json: |
          {
            "clientid": "{{ .ZOT_CLIENT_ID }}",
            "clientsecret": "{{ .ZOT_CLIENT_SECRET }}"
          }
        htpasswd: "{{ .HTPASSWD_ENTRY }}"
  dataFrom:
    - extract:
        key: zot
    - extract:
        key: pocket-id
