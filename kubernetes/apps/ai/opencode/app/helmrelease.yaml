---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
  namespace: ai
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  dependsOn: []
  interval: 1h

  values:
    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/anomalyco/opencode
              tag: 2.0.18@sha256:aa0e5ac93543f24c99dfcc72a6ea7df335faec131dafc16f7607a2c7d3173d28
            env:
              TZ: ${TIMEZONE}
              CORS_DOMAIN: ${SECRET_DOMAIN}
              HOME: /home/opencode
              OPENCODE_CONFIG: /config/opencode.jsonc
            envFrom:
              - secretRef:
                  name: opencode-secret
            command:
              - opencode
            args:
              # 2026-09-12: opencode 2.0.0 renamed the "web" subcommand to
              # "serve" ("Start the v2 API and web server") - same
              # --hostname/--port flags, confirmed via `opencode serve
              # --help` against the 2.0.0 image. The old "web" invocation
              # crash-loops on 2.0.0 with "Unrecognized flag: --hostname".
              - serve
              - --hostname
              - 0.0.0.0
              - --port
              - "4096"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: &probe
                    path: /
                    port: &port 4096
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *probe
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: networking
            sectionName: https
        rules:
          - backendRefs:
              - port: *port
                name: *app
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/name: Opencode
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: /home/opencode
      config-file:
        type: configMap
        name: opencode-config
        globalMounts:
          - path: /config/opencode.jsonc
            subPath: opencode.jsonc
