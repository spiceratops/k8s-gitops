---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: hermes-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ## API Keys
        LITELLM_API_KEY: "{{ .APIKEY_HERMES }}"
        HINDSIGHT_API_KEY: "{{ .HINDSIGHT_CP_ACCESS_KEY }}"
        ## Connections
        WHATSAPP_ALLOWED_USERS: "{{ .WHATSAPP_PHONE_NUMBER }}"
        DISCORD_ALLOWED_USERS: "{{ .DISCORD_ALLOWED_USERS }}"
        ## Tools
        FIRECRAWL_API_KEY: "{{ .FIRECRAWL_API_KEY }}"
        ## Hermes
        API_SERVER_KEY: "{{ .HERMES_API_SERVER_KEY }}"
        OPENCODE_GO_API_KEY: "{{ .OPENCODE_GO_API_KEY }}"
        ZOT_PASSWORD: "{{ .HTPASSWD_ORIGPASSWORD }}"
        GOOGLE_MAPS_API_KEY: "{{ .GOOGLE_MAPS_API_KEY }}"
        ## OIDC
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .HERMES_CLIENT_ID }}"
        ## Barry
        ENRICHMENT_WEBHOOK_URL: "{{ .ENRICHMENT_WEBHOOK_URL }}"
        ENRICHMENT_WEBHOOK_SECRET: "{{ .ENRICHMENT_WEBHOOK_SECRET }}"
        ENRICHMENT_CALLBACK_SECRET: "{{ .ENRICHMENT_CALLBACK_SECRET }}"
        ENRICHMENT_TRIGGER_TOKEN: "{{ .ENRICHMENT_TRIGGER_TOKEN }}"
  dataFrom:
    - extract:
        key: hermes
    - extract:
        key: litellm
    - extract:
        key: hindsight
    - extract:
        key: pocket-id
    - extract:
        key: zot
    - extract:
        key: barry-clank
