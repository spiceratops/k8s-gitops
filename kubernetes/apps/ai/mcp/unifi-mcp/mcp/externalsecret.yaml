---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-mcp
  namespace: ai
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: unifi-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        UNIFI_NETWORK_USERNAME: "{{ .UNIFI_POLLER_USER }}"
        UNIFI_NETWORK_PASSWORD: "{{ .UNIFI_POLLER_PASSWORD }}"
        UNIFI_API_KEY: "{{ .UNIFI_API_KEY }}"
  dataFrom:
    - extract:
        key: unifi
