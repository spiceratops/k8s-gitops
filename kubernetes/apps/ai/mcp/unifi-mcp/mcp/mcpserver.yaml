---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: unifi-mcp
spec:
  image: ghcr.io/sirkirby/unifi-network-mcp:0.48.1@sha256:20651c8da109229f14aa876370150e579b1b9ad42c7d52c30a8844d700b5a2a6
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 3000
  groupRef:
    name: mcp-tools
  env:
    - name: TZ
      value: ${TIMEZONE}
    - name: UNIFI_HOST
      value: unifi.${PRIVATE_DOMAIN}
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_ALLOWED_HOSTS
      value: localhost,127.0.0.1,unifi-mcp.${PRIVATE_DOMAIN}
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    - name: UNIFI_MCP_PORT
      value: "3000"
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          env:
            - name: UNIFI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: unifi-mcp-secret
                  key: UNIFI_NETWORK_USERNAME
            - name: UNIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unifi-mcp-secret
                  key: UNIFI_NETWORK_PASSWORD
            - name: UNIFI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: unifi-mcp-secret
                  key: UNIFI_API_KEY
            - name: UNIFI_MCP_HTTP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: unifi-mcp-secret
                  key: UNIFI_MCP_HTTP_AUTH_TOKEN
