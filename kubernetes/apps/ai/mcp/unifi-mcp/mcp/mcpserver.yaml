---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: unifi-mcp
spec:
  image: ghcr.io/enuno/unifi-mcp-server:0.2.6
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 3000
  groupRef:
    name: mcp-tools
  env:
    - name: UNIFI_NETWORK_HOST
      value: unifi.${PRIVATE_DOMAIN}
    - name: UNIFI_NETWORK_PORT
      value: "443"
    - name: UNIFI_DEFAULT_SITE
      value: default
    - name: MCP_SERVER_TRANSPORT
      value: http
    - name: MCP_SERVER_HOST
      value: 0.0.0.0
    - name: MCP_SERVER_PORT
      value: "3000"
  secrets:
    - name: unifi-mcp-secret
      key: UNIFI_NETWORK_USERNAME
      targetEnvName: UNIFI_NETWORK_USERNAME
    - name: unifi-mcp-secret
      key: UNIFI_NETWORK_PASSWORD
      targetEnvName: UNIFI_NETWORK_PASSWORD
